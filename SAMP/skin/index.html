<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilih Skin</title>
<style>
  :root {
    --card: rgba(13, 19, 28, .92);
    --line: rgba(255, 255, 255, .09);
    --text: #eef3f8;
    --muted: #8d9bad;
    --accent: #3fc1ad;
    --accent-2: #5b8def;
    --accent-3: #9b7bff;
    --bad: #ff7a69;
    --field: #080d13;
  }
  * { box-sizing: border-box; }
  /* Latar TRANSPARAN: karakter di dalam game harus kelihatan di sebelah kiri panel */
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body { font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--text); }

  .brand { position: fixed; top: 28px; left: 34px; display: flex; align-items: center; gap: 12px; }
  .brand .mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent), var(--accent-2)); }
  .brand .mark svg { width: 22px; height: 22px; stroke: #04211c; }
  .brand b { display: block; font-size: 16px; letter-spacing: 2px; font-weight: 700; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
  .brand small { color: #c5d0de; font-size: 12px; letter-spacing: .6px; text-shadow: 0 2px 10px rgba(0,0,0,.7); }

  /* ---------- Panel kanan ---------- */
  .panel-wrap { position: fixed; top: 4vh; bottom: 4vh; right: 3vw; width: min(430px, 46vw); }
  .panel-wrap::before {
    content: ""; position: absolute; inset: -1px; border-radius: 22px; z-index: -1;
    background: linear-gradient(140deg, var(--accent), transparent 38%, transparent 62%, var(--accent-3)); opacity: .55;
  }
  .panel {
    height: 100%; display: flex; flex-direction: column; padding: 26px 24px 20px;
    border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 650; }
  .sub { margin: 6px 0 14px; text-align: center; color: var(--muted); font-size: 13.5px; }
  .chip {
    display: inline-block; margin-left: 6px; padding: 1px 10px; border-radius: 99px; font-size: 12px; color: var(--accent);
    background: rgba(63,193,173,.12); border: 1px solid rgba(63,193,173,.35);
  }

  .grid {
    flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px 4px 2px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start;
  }
  .grid::-webkit-scrollbar { width: 6px; }
  .grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 3px; }
  .skin {
    position: relative; padding: 0; cursor: pointer; border-radius: 14px; overflow: hidden;
    background: var(--field); border: 1px solid var(--line); color: var(--text); font: inherit;
    aspect-ratio: 3 / 4;
  }
  .skin:hover { border-color: rgba(255,255,255,.25); }
  .skin img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .skin .ph { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); }
  .skin .ph svg { width: 44%; stroke: currentColor; opacity: .55; }
  .skin.noimg img { display: none; }
  .skin.noimg .ph { display: grid; }
  .skin .id {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 0 5px; text-align: center; font-size: 12px; font-weight: 600;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
  }
  .skin.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,193,173,.28); }
  .skin.sel .id { color: var(--accent); }
  .skin:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .msg { min-height: 22px; margin: 10px 0 10px; font-size: 13.5px; color: var(--bad); text-align: center; }
  .msg.ok { color: var(--accent); }

  .row { display: flex; gap: 10px; }
  .btn {
    font: inherit; border-radius: 13px; padding: 13px 16px; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--muted);
    display: grid; place-items: center;
  }
  .btn:hover { color: var(--text); background: rgba(255,255,255,.08); }
  .btn svg { width: 20px; height: 20px; stroke: currentColor; }
  .btn.main {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px;
    border: 0; color: #04211c; font-weight: 700; letter-spacing: .3px; background: var(--accent);
  }
  .btn.main:hover { background: #55d3bf; color: #04211c; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spin { width: 16px; height: 16px; border-radius: 50%; display: none; border: 2px solid rgba(4,33,28,.3); border-top-color: #04211c; animation: spin .7s linear infinite; }
  .busy .spin { display: block; }
  .tip { margin: 12px 0 0; text-align: center; color: var(--muted); font-size: 12px; opacity: .8; }
  .tip kbd { font: inherit; font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.05); color: var(--text); }

  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .shake, .spin { animation: none; } }
  @media (max-height: 560px) { .brand { display: none; } }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V7l8 7 8-7v11"/></svg>
    </div>
    <div><b>OLD TOWN ROLEPLAY</b><small>Tempat Berperan Nomor Satu</small></div>
  </div>

  <div class="panel-wrap" id="wrap">
    <main class="panel">
      <h1>Pilih Skin</h1>
      <p class="sub">Klik skin untuk melihatnya langsung di game. <span class="chip" id="chip">-</span></p>

      <div class="grid" id="grid" role="listbox" aria-label="Daftar skin"></div>

      <div class="msg" id="msg" role="alert"></div>

      <div class="row">
        <button class="btn" id="rotL" type="button" aria-label="Putar ke kiri" title="Putar kiri">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="btn main" id="ok" type="button"><span class="spin"></span><span id="okText">Pilih Skin Ini</span></button>
        <button class="btn" id="rotR" type="button" aria-label="Putar ke kanan" title="Putar kanan">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-9-9 9 9 0 016.4 2.6L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
      <p class="tip">Tombol <kbd>&larr;</kbd> <kbd>&rarr;</kbd> memutar karakter &nbsp;·&nbsp; <kbd>Enter</kbd> memilih</p>
    </main>
  </div>

<script>
(function () {
  var hasCef = typeof window.cef !== "undefined";

  /* ------------------------------------------------------------------
     SUMBER GAMBAR SKIN. Dicoba berurutan; kalau gagal pindah ke berikutnya,
     kalau semua gagal tampil placeholder + nomor ID.
       1) skins/{id}.png  -> folder di sebelah halaman ini (paling stabil, host sendiri)
       2) assets.open.mp  -> gambar skin resmi open.mp (butuh internet di sisi pemain)
     Ganti / tambah sesuai hostingmu. {id} diganti dengan ID skin.
  ------------------------------------------------------------------ */
  var SKIN_SOURCES = [
    "skins/{id}.png",
    "https://assets.open.mp/assets/images/skins/{id}.png"
  ];
  var DEMO_MALE = [7, 14, 15, 17, 20, 21, 22, 23, 24, 25, 26, 28, 29, 30, 32, 33, 34, 35, 36, 37];
  var DEMO_FEMALE = [9, 10, 11, 12, 13, 31, 38, 39, 40, 41, 53, 54, 55, 56, 63, 64, 65, 69, 75, 85];

  function $(id) { return document.getElementById(id); }
  var elGrid = $("grid"), elMsg = $("msg"), elOk = $("ok"), elOkText = $("okText"), elWrap = $("wrap"), elChip = $("chip");
  var skins = [], selected = -1, busy = false, timer = null, ready = false;

  function setBusy(b) {
    busy = b;
    elOk.disabled = b;
    elOk.classList.toggle("busy", b);
    elOkText.textContent = b ? "Memproses..." : "Pilih Skin Ini";
    if (!b && timer) { clearTimeout(timer); timer = null; }
  }

  function showError(t) {
    elMsg.classList.remove("ok");
    elMsg.textContent = t;
    elWrap.classList.remove("shake");
    void elWrap.offsetWidth;
    elWrap.classList.add("shake");
  }

  function placeholderSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/></svg>';
  }

  function makeCard(id) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "skin";
    b.setAttribute("role", "option");
    b.setAttribute("data-id", id);

    var img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "Skin " + id;
    var src = 0;
    img.onerror = function () {
      src++;
      if (src < SKIN_SOURCES.length) img.src = SKIN_SOURCES[src].replace("{id}", id);
      else b.classList.add("noimg");
    };
    img.src = SKIN_SOURCES[0].replace("{id}", id);
    b.appendChild(img);

    var ph = document.createElement("div");
    ph.className = "ph";
    ph.innerHTML = placeholderSvg();
    b.appendChild(ph);

    var lab = document.createElement("div");
    lab.className = "id";
    lab.textContent = "ID " + id;
    b.appendChild(lab);

    b.addEventListener("click", function () { select(parseInt(b.getAttribute("data-id"), 10), true); });
    return b;
  }

  function select(id, preview) {
    var i = skins.indexOf(id);
    if (i < 0) return;
    selected = i;
    var cards = elGrid.children;
    for (var k = 0; k < cards.length; k++) {
      var on = k === i;
      cards[k].classList.toggle("sel", on);
      cards[k].setAttribute("aria-selected", on ? "true" : "false");
    }
    elMsg.textContent = "";
    if (cards[i].scrollIntoView) cards[i].scrollIntoView({ block: "nearest" });
    if (preview && hasCef) window.cef.emit("skin:preview", String(id));
  }

  /* Dari server: skin:init(gender, "id,id,id,...") */
  function onInit(gender, csv) {
    var g = parseInt(gender, 10);
    elChip.textContent = g === 2 ? "Perempuan" : "Laki-Laki";
    skins = String(csv || "").split(",").map(function (s) { return parseInt(s, 10); })
                             .filter(function (n) { return !isNaN(n) && n >= 0; });
    elGrid.innerHTML = "";
    if (!skins.length) { showError("Daftar skin kosong. Hubungi admin."); return; }
    var frag = document.createDocumentFragment();
    skins.forEach(function (id) { frag.appendChild(makeCard(id)); });
    elGrid.appendChild(frag);
    ready = true;
    select(skins[0], false);   /* server sudah memasang skin pertama */
  }

  /* Dari server: skin:result(ok) */
  function onResult(ok) {
    setBusy(false);
    if (parseInt(ok, 10) === 1) {
      elMsg.classList.add("ok");
      elMsg.textContent = "Skin dipilih. Selamat bermain!";
      elOk.disabled = true;
      setTimeout(function () {
        if (hasCef) { window.cef.set_focus(false); window.cef.hide(true); }
      }, 700);
    } else showError("Skin tidak valid. Pilih ulang.");
  }

  function confirmSkin() {
    if (busy || !ready || selected < 0) return;
    setBusy(true);
    timer = setTimeout(function () { setBusy(false); showError("Server tidak membalas. Coba lagi."); }, 8000);
    if (hasCef) window.cef.emit("skin:confirm", String(skins[selected]));
    else setTimeout(function () { onResult(1); }, 500);
  }

  function rotate(dir) { if (hasCef) window.cef.emit("skin:rotate", String(dir)); }

  function move(delta) {
    if (!ready) return;
    var n = Math.max(0, Math.min(skins.length - 1, selected + delta));
    if (n !== selected) select(skins[n], true);
  }

  $("rotL").addEventListener("click", function () { rotate(-1); });
  $("rotR").addEventListener("click", function () { rotate(1); });
  elOk.addEventListener("click", confirmSkin);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { rotate(-1); e.preventDefault(); }
    else if (e.key === "ArrowRight") { rotate(1); e.preventDefault(); }
    else if (e.key === "ArrowUp") { move(-3); e.preventDefault(); }
    else if (e.key === "ArrowDown") { move(3); e.preventDefault(); }
    else if (e.key === "Enter") { confirmSkin(); }
  });

  if (hasCef) {
    window.cef.set_focus(true);
    window.cef.on("skin:init", onInit);
    window.cef.on("skin:result", onResult);
    window.cef.emit("skin:ready");
  } else {
    /* Mode simulasi di browser biasa: latar digelapkan supaya panel terlihat */
    document.body.style.background = "linear-gradient(120deg,#0b1220,#1b2a3f)";
    onInit(1, DEMO_MALE.join(","));
  }
})();
</script>
</body>
</html>
