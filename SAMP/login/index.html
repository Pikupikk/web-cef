<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
  :root {
    --card: rgba(255, 255, 255, .94);
    --line: rgba(20, 40, 60, .12);
    --text: #17222d;
    --muted: #5d6c7c;
    --accent: #1fa592;
    --accent-d: #178273;
    --accent-2: #5b8def;
    --accent-3: #9b7bff;
    --bad: #d9432f;
    --field: #f3f6f9;
  }
  * { box-sizing: border-box; }
  /* Latar TRANSPARAN: karakter di dalam game harus kelihatan (di tengah, menghadap kamera) */
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body { font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--text); }

  .brand { position: fixed; top: 28px; left: 34px; display: flex; align-items: center; gap: 12px; }
  .brand .mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent), var(--accent-2)); }
  .brand .mark svg { width: 22px; height: 22px; stroke: #fff; }
  .brand b { display: block; font-size: 16px; letter-spacing: 2px; font-weight: 700; line-height: 1.1; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.65); }
  .brand small { color: #f1f5f9; font-size: 12px; letter-spacing: .6px; text-shadow: 0 2px 10px rgba(0,0,0,.65); }

  /* ---------- Panel di bawah karakter ---------- */
  .wrap { position: fixed; left: 50%; bottom: 5vh; width: min(440px, 92vw); transform: translateX(-50%); }
  .card {
    padding: 20px 22px 16px; border-radius: 20px; background: var(--card);
    border: 1px solid var(--line); box-shadow: 0 14px 40px rgba(10, 25, 40, .28);
  }
  .hello { margin: 0; text-align: center; font-size: 12.5px; color: var(--muted); letter-spacing: .4px; }
  h1 { margin: 0 0 14px; text-align: center; font-size: 22px; font-weight: 650; letter-spacing: .2px; }
  h1 span { color: var(--accent-d); }

  .line { display: flex; gap: 10px; }
  .field { position: relative; flex: 1; min-width: 0; }
  .field .lead {
    position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%);
    stroke: var(--muted); pointer-events: none;
  }
  .field:focus-within .lead { stroke: var(--accent-d); }
  input {
    width: 100%; font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 13px; padding: 13px 46px 13px 42px;
  }
  input::placeholder { color: #94a1af; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(31,165,146,.18); background: #fff; }
  .toggle {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 10px; cursor: pointer; color: var(--muted);
  }
  .toggle:hover { color: var(--text); background: rgba(20,40,60,.07); }
  .toggle svg { width: 18px; height: 18px; stroke: currentColor; }
  .toggle .off { display: none; }
  .toggle.on .off { display: block; }
  .toggle.on .on { display: none; }

  .btn {
    font: inherit; border-radius: 13px; padding: 0 22px; cursor: pointer;
    border: 0; background: var(--accent); color: #fff; font-weight: 700; letter-spacing: .3px;
    display: flex; align-items: center; justify-content: center; gap: 9px; white-space: nowrap;
  }
  .btn:hover { background: var(--accent-d); }
  .btn:disabled { opacity: .65; cursor: default; }
  .btn:focus-visible, .toggle:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spin {
    width: 16px; height: 16px; border-radius: 50%; display: none;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite;
  }
  .busy .spin { display: block; }

  .msg { min-height: 20px; margin: 10px 0 0; font-size: 13.5px; color: var(--bad); text-align: center; }
  .msg.ok { color: var(--accent-d); }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .attempts { display: flex; align-items: center; gap: 8px; }
  .dots { display: flex; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .dot.lost { background: rgba(20,40,60,.16); }
  .dot.warn { background: var(--bad); }
  .link { font: inherit; background: none; border: 0; padding: 4px 6px; border-radius: 8px; cursor: pointer; color: var(--muted); }
  .link:hover { color: var(--bad); background: rgba(217,67,47,.08); }
  .note { margin: 6px 0 0; text-align: center; color: var(--muted); font-size: 11.5px; opacity: .85; }

  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(calc(-50% - 7px)); } 40%,80% { transform: translateX(calc(-50% + 7px)); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .shake, .spin { animation: none; } }
  @media (max-height: 560px) { .brand { display: none; } }

  /* Siluet hanya muncul di browser biasa (simulasi) */
  .sim { display: none; }
  body.sim-on .sim {
    display: block; position: fixed; left: 50%; top: 6vh; height: 52vh; transform: translateX(-50%); opacity: .55;
    stroke: #3b5068; pointer-events: none;
  }
</style>
</head>
<body>
  <svg class="sim" viewBox="0 0 120 300" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="60" cy="34" r="22"/><path d="M28 110c4-30 20-44 32-44s28 14 32 44l-6 70H34z"/><path d="M42 180l-4 110M78 180l4 110M28 110l-14 70M92 110l14 70"/>
  </svg>

  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V7l8 7 8-7v11"/></svg>
    </div>
    <div><b>OLD TOWN ROLEPLAY</b><small>Tempat Berperan Nomor Satu</small></div>
  </div>

  <div class="wrap" id="wrap">
    <main class="card">
      <p class="hello">Selamat datang kembali</p>
      <h1 id="who"><span>Pemain</span></h1>

      <div class="line">
        <div class="field">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="11" width="16" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/>
          </svg>
          <input id="pass" type="password" autocomplete="off" maxlength="64" placeholder="Masukkan password" aria-label="Password" autofocus>
          <button class="toggle" id="toggle" type="button" aria-label="Tampilkan password">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.5 10.5 0 0112 6c6.4 0 10 6 10 6a17 17 0 01-3.3 4M6.5 7.8C3.6 9.5 2 12 2 12s3.6 6 10 6c1.4 0 2.7-.3 3.8-.7"/></svg>
          </button>
        </div>
        <button class="btn" id="login" type="button"><span class="spin"></span><span id="loginText">Masuk</span></button>
      </div>

      <div class="msg" id="msg" role="alert"></div>

      <div class="foot">
        <div class="attempts"><div class="dots" id="dots" aria-hidden="true"></div><span id="attemptsText"></span></div>
        <button class="link" id="abort" type="button">Keluar</button>
      </div>
      <p class="note" id="note"></p>
    </main>
  </div>

<script>
(function () {
  var hasCef = typeof window.cef !== "undefined";
  var MAX_ATTEMPTS = 3;
  var attemptsLeft = MAX_ATTEMPTS;
  var busy = false;
  var timer = null;

  var elPass = document.getElementById("pass");
  var elMsg = document.getElementById("msg");
  var elLogin = document.getElementById("login");
  var elLoginText = document.getElementById("loginText");
  var elNote = document.getElementById("note");
  var elWrap = document.getElementById("wrap");
  var elDots = document.getElementById("dots");
  var elAttemptsText = document.getElementById("attemptsText");
  var elToggle = document.getElementById("toggle");
  var elWho = document.getElementById("who");

  function setBusy(b) {
    busy = b;
    elLogin.disabled = b;
    elLogin.classList.toggle("busy", b);
    elLoginText.textContent = b ? "Memeriksa..." : "Masuk";
    if (!b && timer) { clearTimeout(timer); timer = null; }
  }

  function showError(text) {
    elMsg.classList.remove("ok");
    elMsg.textContent = text;
    elWrap.classList.remove("shake");
    void elWrap.offsetWidth;
    elWrap.classList.add("shake");
    elPass.select();
  }

  function renderAttempts() {
    elDots.innerHTML = "";
    for (var i = 0; i < MAX_ATTEMPTS; i++) {
      var d = document.createElement("span");
      d.className = "dot" + (i >= attemptsLeft ? " lost" : (attemptsLeft === 1 ? " warn" : ""));
      elDots.appendChild(d);
    }
    elAttemptsText.textContent = "Sisa percobaan: " + attemptsLeft;
    elNote.textContent = "Jika percobaan habis, kamu akan dikeluarkan dari server.";
  }

  function setName(name) {
    var n = String(name || "").replace(/_/g, " ").trim();
    elWho.innerHTML = "";
    var s = document.createElement("span");
    s.textContent = n || "Pemain";
    elWho.appendChild(s);
  }

  function submit() {
    if (busy) return;
    var pw = elPass.value;
    if (!pw) { showError("Password belum diisi."); return; }
    elMsg.textContent = "";
    setBusy(true);
    /* Jika server tidak membalas dalam 8 detik, jangan menggantung selamanya */
    timer = setTimeout(function () {
      setBusy(false);
      showError("Server tidak membalas. Coba lagi.");
    }, 8000);
    if (hasCef) {
      window.cef.emit("auth:login", pw);
    } else {
      /* Mode simulasi di browser biasa: password yang benar adalah test123 */
      setTimeout(function () {
        if (pw === "test123") onResult(1, attemptsLeft);
        else onResult(0, attemptsLeft - 1);
      }, 600);
    }
  }

  /* Dari server: auth:init(sisaPercobaan, namaPemain). Argumen ke-2 opsional */
  function onInit(attempts, name) {
    var n = parseInt(attempts, 10);
    if (!isNaN(n)) attemptsLeft = n;
    if (name) setName(name);
    renderAttempts();
    elPass.focus();
  }

  /* Dari server: auth:result(ok, sisaPercobaan), keduanya angka */
  function onResult(ok, attempts) {
    setBusy(false);
    var n = parseInt(attempts, 10);
    if (!isNaN(n)) attemptsLeft = n;
    renderAttempts();
    if (parseInt(ok, 10) === 1) {
      elMsg.classList.add("ok");
      elMsg.textContent = "Berhasil masuk. Selamat bermain!";
      elLogin.disabled = true;
      /* Lepas kendali mouse dan keyboard ke game, lalu sembunyikan halaman */
      setTimeout(function () {
        if (hasCef) {
          window.cef.set_focus(false);
          window.cef.hide(true);
        }
      }, 600);
    } else {
      showError("Password salah.");
    }
  }

  elLogin.addEventListener("click", submit);
  elPass.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  document.getElementById("abort").addEventListener("click", function () {
    if (hasCef) window.cef.emit("auth:abort");
    else elMsg.textContent = "(simulasi) server akan mengeluarkan pemain.";
  });
  elToggle.addEventListener("click", function () {
    var show = elPass.type === "password";
    elPass.type = show ? "text" : "password";
    elToggle.classList.toggle("on", show);
    elToggle.setAttribute("aria-label", show ? "Sembunyikan password" : "Tampilkan password");
    elPass.focus();
  });

  if (hasCef) {
    window.cef.set_focus(true);
    window.cef.on("auth:init", onInit);
    window.cef.on("auth:result", onResult);
    window.cef.emit("auth:ready");
  } else {
    /* Mode simulasi di browser biasa: latar terang + siluet supaya tata letak terlihat */
    document.body.style.background = "linear-gradient(180deg,#9fc3e6,#e8f1f8)";
    document.body.classList.add("sim-on");
    onInit(MAX_ATTEMPTS, "Nama_Pemain");
    elNote.textContent = "Mode simulasi di browser. Password yang benar: test123.";
  }
})();
</script>
</body>
</html>
