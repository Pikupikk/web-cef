<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Phone</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;color:#fff;user-select:none}
svg{display:block}
#ph{position:fixed;right:40px;bottom:30px;width:310px;height:640px;border-radius:54px;background:#0b0b0d;padding:10px;box-shadow:0 0 0 2px #3b3b40,0 0 0 4px #121214,0 30px 80px rgba(0,0,0,.65);transition:transform .4s cubic-bezier(.2,.9,.3,1),opacity .3s}
#ph.off{transform:translateY(110%);opacity:0;pointer-events:none}
#ph:before{content:"";position:absolute;right:-5px;top:150px;width:3px;height:70px;border-radius:2px;background:#2c2c30}
#ph:after{content:"";position:absolute;left:-5px;top:120px;width:3px;height:44px;border-radius:2px;background:#2c2c30;box-shadow:0 60px #2c2c30,0 115px #2c2c30}
#scr{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background-color:#0d0707;
background-image:radial-gradient(120% 60% at 95% 22%,#ff6a1f 0,transparent 55%),radial-gradient(90% 50% at 5% 58%,#c2185b 0,transparent 60%),radial-gradient(100% 50% at 80% 98%,#ff9a3c 0,transparent 55%),linear-gradient(#1b0a0c,#0b0b0d)}
#isl{position:absolute;top:10px;left:50%;width:88px;height:26px;margin-left:-44px;background:#000;border-radius:16px;z-index:60}
#sb{position:absolute;top:0;left:0;right:0;height:48px;padding:15px 26px 0 30px;display:flex;justify-content:space-between;font-weight:600;font-size:13.5px;z-index:55;pointer-events:none}
#sb .r{display:flex;gap:5px;align-items:center}
.bat{width:23px;height:11px;border:1.4px solid currentColor;border-radius:3.5px;position:relative;opacity:.95}.bat:after{content:"";position:absolute;inset:1.4px;right:5px;background:currentColor;border-radius:1.5px}
.lt #sb{color:#000}.lt .hb{background:#000}
#home{position:absolute;inset:0;padding:70px 16px 0;transition:transform .3s,opacity .3s,filter .3s}
#home.bg{transform:scale(.92);opacity:.5;filter:blur(3px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;cursor:pointer;position:relative}
.ic i{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;box-shadow:0 2px 8px #0006,inset 0 0 0 .5px #fff3;transition:transform .12s;position:relative}
.ic:active i{transform:scale(.88)}
.ic svg{fill:#fff}
.bdg{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#ff3b30;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 1.5px #0003;font-style:normal}
.dock{position:absolute;left:10px;right:10px;bottom:22px;height:82px;border-radius:30px;background:#ffffff2e;backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);place-items:center}
.dock .ic span{display:none}
.hb{position:absolute;bottom:7px;left:50%;width:118px;height:5px;margin-left:-59px;border-radius:3px;background:#fff;opacity:.9;z-index:70;cursor:pointer}
/* app container */
.app{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;padding-top:48px;opacity:0;transform:scale(.82);transition:transform .32s cubic-bezier(.2,.9,.3,1),opacity .25s;z-index:20;color:#fff;border-radius:44px}
.app.on{opacity:1;transform:none}.app.closing{opacity:0;transform:scale(.82)}
.app.light{background:#f2f2f7;color:#000}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 10px 6px;min-height:44px;flex:none}
.hd .hm{font-weight:600;font-size:17px;text-align:center}.hd .hr{justify-self:end}
.bk{display:flex;align-items:center;color:#0a84ff;cursor:pointer;font-size:16px;margin-left:-4px}.bk svg{fill:#0a84ff}
.rb{color:#0a84ff;cursor:pointer;padding:4px 6px;font-size:16px;display:flex;align-items:center}.rb svg{fill:#0a84ff}
.body{flex:1;overflow:auto;padding-bottom:26px}.body::-webkit-scrollbar{width:0}
.big{font-size:31px;font-weight:700;padding:2px 16px 6px;letter-spacing:-.4px}
.sub{color:#8e8e93;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow{flex:1;min-width:0}.tm{color:#8e8e93;font-size:12.5px;flex:none}
.sec{padding:14px 16px 5px;color:#6c6c70;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(#a9b0bd,#7a8191);display:grid;place-items:center;font-weight:600;font-size:18px;color:#fff;flex:none}
.empty{text-align:center;color:#8e8e93;padding:50px 30px;font-size:14px}
/* pesan */
.srch{margin:2px 14px 8px;background:#7676801f;border-radius:10px;padding:7px 10px;display:flex;gap:6px;align-items:center;color:#8e8e93}
.srch input{flex:1;border:0;background:transparent;font:inherit;outline:0;color:#000}
.mr{display:flex;align-items:center;gap:11px;padding:0 0 0 14px;cursor:pointer;background:#fff}.mr:active{background:#e5e5ea}
.mr .in{flex:1;min-width:0;padding:10px 14px 10px 0;border-bottom:1px solid #c6c6c8;display:flex;align-items:center;gap:8px}
.mr b{font-size:15.5px}.mr .l1{display:flex;justify-content:space-between;gap:6px}
.mr .sub{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dot{width:11px;height:11px;border-radius:50%;background:#0a84ff;flex:none}
.thh{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px}.thh .av{width:34px;height:34px;font-size:14px}
.th{display:flex;flex-direction:column;gap:2px;padding:6px 12px 10px}
.b{max-width:76%;padding:7px 12px 6px;border-radius:19px;word-wrap:break-word;font-size:14.5px;line-height:1.3;position:relative}
.b.me{align-self:flex-end;background:linear-gradient(#2a95ff,#0a84ff);color:#fff}.b.them{align-self:flex-start;background:#e5e5ea;color:#000}
.b.me.tl{border-bottom-right-radius:5px}.b.them.tl{border-bottom-left-radius:5px}
.b.gap{margin-top:7px}
.b small{display:block;font-size:9.5px;opacity:.65;text-align:right;margin-top:1px}
.ds{align-self:center;color:#8e8e93;font-size:11px;margin:12px 0 4px;text-align:center}
.dl{align-self:flex-end;color:#8e8e93;font-size:10.5px;margin:1px 4px 0}
.cmp{display:flex;gap:8px;align-items:center;padding:8px 10px 24px;background:#f9f9f9ee;border-top:1px solid #0002;flex:none}
.cmp .pl{width:30px;height:30px;border-radius:50%;background:#e5e5ea;display:grid;place-items:center;font-size:20px;color:#8e8e93;flex:none}
.cmp input{flex:1;min-width:0;border:1px solid #c8c8cc;border-radius:18px;padding:7px 13px;font:inherit;font-size:14.5px;outline:0;background:#fff;color:#000}
.snd{width:30px;height:30px;border-radius:50%;background:#0a84ff;display:grid;place-items:center;cursor:pointer;flex:none}.snd svg{fill:#fff}.snd.dis{background:#c7c7cc;pointer-events:none}
.to{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #c6c6c8}.to span{color:#8e8e93}.to input{flex:1;border:0;outline:0;font:inherit;color:#000;background:transparent}
.nt{position:absolute;top:14px;left:10px;right:10px;z-index:80;background:#ffffffee;color:#000;backdrop-filter:blur(20px);border-radius:22px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 28px #0006;transform:translateY(-130px);transition:transform .4s cubic-bezier(.2,.9,.3,1);cursor:pointer;margin-top:26px}
.nt.on{transform:none}.nt .si{width:32px;height:32px;border-radius:8px;background:linear-gradient(#5ee06f,#26b340);display:grid;place-items:center;flex:none}.nt .si svg{fill:#fff}
.nt b{font-size:13px}.nt div div{font-size:12.5px;color:#333;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* telepon */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#161618f2;border-top:1px solid #ffffff1a;padding:7px 0 26px;flex:none}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8e8e93;cursor:pointer}.tabs div svg{fill:#8e8e93}.tabs .a{color:#0a84ff}.tabs .a svg{fill:#0a84ff}
.crow{display:flex;align-items:center;gap:11px;padding:0 0 0 16px;cursor:pointer}.crow:active{background:#ffffff14}
.crow .in{flex:1;min-width:0;padding:10px 16px 10px 0;border-bottom:1px solid #ffffff1a;display:flex;align-items:center;gap:8px}
.miss{color:#ff453a}
.disp{text-align:center;font-size:32px;font-weight:300;height:44px;margin-top:10px;letter-spacing:1px;overflow:hidden;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px 18px;justify-content:center;margin-top:6px}
.k{width:70px;height:70px;border-radius:50%;background:#ffffff26;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:29px;cursor:pointer;line-height:1}.k:active{background:#ffffff66}.k small{font-size:8.5px;letter-spacing:2px;margin-top:2px;font-weight:600;height:9px}
.cb{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;cursor:pointer}.cb svg{fill:#fff}.green{background:#30d158}.red{background:#ff453a}.cb:active{filter:brightness(.8)}
.del{width:70px;height:70px;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:24px}
#call{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;padding:86px 20px 44px;background:radial-gradient(120% 70% at 50% 0,#5a5f6e 0,transparent 70%),linear-gradient(#34363e,#121316);text-align:center}
#call.on{display:flex;animation:fi .3s}@keyframes fi{from{opacity:0;transform:scale(1.05)}}
#call .av{width:92px;height:92px;font-size:40px;margin-bottom:12px}#call h2{margin:0;font-weight:400;font-size:28px}
.pulse{animation:pl 1.6s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 #ffffff55}100%{box-shadow:0 0 0 26px #fff0}}
.cg{display:grid;grid-template-columns:repeat(3,64px);gap:16px 22px;margin:auto 0 24px}.cg div{display:flex;flex-direction:column;gap:5px;font-size:11px;align-items:center}
.cg i{width:62px;height:62px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;cursor:pointer;font-style:normal}.cg i svg{fill:#fff}.cg i.act{background:#fff}.cg i.act svg{fill:#000}
.inc{display:flex;justify-content:space-between;width:100%;padding:0 18px;margin-top:auto}.inc div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px}
.qk{display:flex;justify-content:space-between;width:100%;padding:0 20px;margin-top:auto;margin-bottom:34px}.qk div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#fff;cursor:pointer}.qk i{width:44px;height:44px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-style:normal}.qk svg{fill:#fff}
/* bank */
.card{margin:6px 16px 14px;border-radius:20px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#0a84ff,#5e5ce6 58%,#bf5af2);box-shadow:0 10px 26px #5e5ce655;position:relative;overflow:hidden}
.card:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff1c}
.card .bn{display:flex;justify-content:space-between;font-weight:700;letter-spacing:.5px;font-size:13px;opacity:.95}
.card .chip{width:34px;height:25px;border-radius:5px;background:linear-gradient(135deg,#ffe29a,#d9a441);margin:12px 0 8px}
.card small{opacity:.8;font-size:11.5px}.card .n{font-size:29px;font-weight:700;margin:2px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.5px}.card .n svg{fill:#fff;opacity:.8;cursor:pointer}
.card .nm{font-weight:600;font-size:14px;margin-top:2px}
.act{display:flex;justify-content:center;gap:34px;margin-bottom:6px}.act div{text-align:center;font-size:12px;cursor:pointer;color:#0a84ff;font-weight:500}.act i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#0a84ff;margin:0 auto 5px;box-shadow:0 4px 12px #0a84ff55}.act i svg{fill:#fff}
.note{margin:6px 22px 0;font-size:11.5px;color:#8e8e93;text-align:center}
.lst{background:#fff;margin:0 14px;border-radius:12px;overflow:hidden}
.br{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:13.5px;border-bottom:1px solid #eee}.br:last-child{border:0}
.bi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}.bi.p{background:#d9f7e4}.bi.n{background:#ffe3e1}.bi.p svg{fill:#1e9e55}.bi.n svg{fill:#e5342a}
.amt{white-space:nowrap;flex:none}.pos{color:#1e9e55}.neg{color:#e5342a}
.fld{margin:0 14px 10px;background:#fff;border-radius:12px;overflow:hidden}.fld input{width:100%;border:0;border-bottom:1px solid #eee;padding:13px 14px;font:inherit;outline:0;color:#000;background:#fff}.fld input:last-child{border:0}
.chips{display:flex;gap:6px;padding:0 14px 10px;flex-wrap:wrap}.chips span{background:#fff;color:#0a84ff;border-radius:14px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:500}
.btn{margin:10px 14px;padding:14px;border-radius:14px;background:#0a84ff;color:#fff;text-align:center;font-weight:600;cursor:pointer}.btn:active{filter:brightness(.88)}.btn.dis{opacity:.4;pointer-events:none}.btn.g{background:#e5e5ea;color:#0a84ff}
.msg{margin:0 14px 8px;padding:10px;border-radius:10px;font-size:13px;text-align:center;background:#ffe0de;color:#b3261e}
.shd{position:absolute;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;animation:fo .2s}@keyframes fo{from{opacity:0}}
.sht{width:100%;background:#f2f2f7;color:#000;border-radius:24px 24px 0 0;padding:16px 0 28px;animation:up .3s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(100%)}}
.sht h3{margin:0 0 10px;text-align:center;font-size:16px}
.kv{display:flex;justify-content:space-between;padding:9px 20px;font-size:14px;border-bottom:1px solid #e3e3e8}.kv span:first-child{color:#8e8e93}
.ok{text-align:center;padding:50px 20px 10px}.ok .ck{width:84px;height:84px;border-radius:50%;background:#30d158;margin:0 auto 16px;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}.ok .ck svg{fill:#fff}@keyframes pop{from{transform:scale(0)}}
/* kendaraan */
.car{margin:8px 14px;padding:13px;border-radius:16px;background:#1c1c1e;display:flex;gap:12px;align-items:center}
.car .ci{width:44px;height:44px;border-radius:12px;background:#2c2c2e;display:grid;place-items:center;flex:none}.car .ci svg{fill:#0a84ff}
.plate{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.8px;background:#f5f5f0;color:#111;border-radius:4px;padding:1px 6px;margin-right:6px}
.tag{font-size:11px;padding:3px 9px;border-radius:9px;background:#30d15833;color:#30d158;font-weight:600;flex:none}.tag.x{background:#ff9f0a33;color:#ff9f0a}.tag.r{background:#ff453a33;color:#ff453a}
/* lokasi kendaraan & kontak */
.car .loc{white-space:normal;color:#aeaeb2;margin-top:3px;font-size:12.5px;line-height:1.3}
.trk{display:inline-block;margin-top:7px;font-size:12px;font-weight:600;color:#0a84ff;background:#0a84ff22;border-radius:10px;padding:4px 11px;cursor:pointer}.trk:active{filter:brightness(.8)}
.kac{display:flex;gap:8px;flex:none}.kac i{width:34px;height:34px;border-radius:50%;background:#e9e9ef;display:grid;place-items:center;cursor:pointer;font-style:normal}.kac i:active{background:#d1d1d6}.kac svg{fill:#0a84ff}
.delb{color:#ff3b30;font-size:14px;font-weight:600;padding:6px 4px 6px 10px;cursor:pointer;flex:none}.delb:active{opacity:.5}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:16px;font-size:12.5px;z-index:90}
/* status pesan */
.b.fail{background:linear-gradient(#ff5a50,#e0352b)}.b.fail{cursor:pointer}
.dl.err{color:#ff3b30;font-weight:500;text-align:right;max-width:80%}
/* pengaturan */
.pf{display:flex;align-items:center;gap:14px;background:#fff;margin:2px 14px 16px;border-radius:12px;padding:12px 14px;color:#000}.pf .av{width:58px;height:58px;font-size:24px}.pf b{font-size:17px}
.sg{background:#fff;margin:0 14px 16px;border-radius:12px;overflow:hidden;color:#000}
.sr{display:flex;align-items:center;gap:12px;padding:8px 14px;font-size:15px;border-bottom:1px solid #eee;min-height:46px}.sr:last-child{border:0}
.sri{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;flex:none}.sri svg{fill:#fff}
.sv{color:#8e8e93;margin-left:auto;font-size:15px;white-space:nowrap}.sv.low{color:#ff3b30;font-weight:600}
.sw{margin-left:auto;width:51px;height:31px;border-radius:16px;background:#e9e9ea;position:relative;cursor:pointer;transition:background .2s;flex:none}.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0004;transition:transform .2s}.sw.on{background:#34c759}.sw.on:after{transform:translateX(20px)}
.ft{margin:-8px 28px 16px;font-size:12px;color:#6c6c70;line-height:1.35}
/* airdrop */
.rdr{position:relative;height:178px;display:grid;place-items:center;flex:none;color:#fff}
.rdr i{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid #0a84ff;opacity:0;animation:rp 3s infinite;font-style:normal}.rdr i:nth-child(2){animation-delay:1s}.rdr i:nth-child(3){animation-delay:2s}
@keyframes rp{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.7);opacity:0}}
.rdr .core{position:relative;z-index:2;width:64px;height:64px;border-radius:50%;background:linear-gradient(#58c8ff,#0a7cff);display:grid;place-items:center;box-shadow:0 6px 22px #0a84ff66}
.adn{margin:0 28px 4px;font-size:12px;color:#8e8e93;text-align:center;line-height:1.35}
.trk.sm{margin:0}
</style></head><body>

<script>
(function(){'use strict';
/* ===== KONTRAK DENGAN PAWN (cef.emit -> Pawn / cef_emit_event <- Pawn; isi = JSON string) =====
 Pawn -> halaman:
  phone:open      {name,number,credit,air,bank:{name,no,balance,hist:[{t,amt,ts}]}}
  phone:close
  phone:bank      {name,no,balance,hist:[...]}
  phone:sms_all   {"08123":{name,unread,msgs:[{m:"me|them",t,ts}]}}    (history dari database)
  phone:sms_in    {from,name,text,ts}
  phone:calls     [{name,num,type:"out|in|miss",ts}]                    (opsional)
  phone:cars      [{id,model,plate,state,loc,dist}]    (id = id database kendaraan, dist = jarak meter)
  phone:contacts  {book:0|1,list:[{name,number}]}       (isi phonebook; book:0 = tidak punya item phonebook)
  phone:incoming  {name,number} | phone:connected | phone:ended {text?}
  phone:tf_result {ok,msg,balance}
  phone:saved     {list:[{name,number}]}                                (kontak tersimpan di database, tabel phone_contacts)
  phone:contact_err {msg}
  phone:sms_result {to,ok,msg,credit}    (hasil kirim SMS: ok:1 = terkirim, ok:0 = gagal + alasan di msg)
  phone:settings  {number,credit,air}    (app Pengaturan; air:1 = mode pesawat)
  phone:airdrop   {range,list:[{id,dist}]} (pemain terdekat, HANYA id + jarak meter, tanpa nama)
  phone:airdrop_res {ok,msg}
 Halaman -> Pawn:
