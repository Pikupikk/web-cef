<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>GPS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;color:#f2f2f7;user-select:none}
svg{display:block}
:root{--me:#0a84ff;--job:#ff9f0a;--city:#bf5af2;--near:#30d158;--line:#ffffff17;--dim:#8e8e99}

#wrap{position:fixed;inset:0;display:none}
#wrap.on{display:block}
#app{position:absolute;right:40px;top:50%;width:400px;height:640px;margin-top:-320px;transform-origin:right center;
  display:flex;flex-direction:column;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,#171a21f2,#0e1014f7);backdrop-filter:blur(22px);
  box-shadow:0 0 0 1px #ffffff1f,0 30px 80px #000a;animation:in .35s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateX(40px) scale(.97)}}

/* header */
.hd{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;flex:none}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(#ffb340,#ff7a00);display:grid;place-items:center;box-shadow:0 4px 14px #ff7a0055}
.logo svg{stroke:#fff}
.hd h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px;flex:1}
.hd small{display:block;font-size:11.5px;font-weight:400;color:var(--dim);letter-spacing:0}
.x{width:30px;height:30px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.x:hover{background:#ffffff26}.x svg{stroke:#fff}

/* rute aktif */
.act{margin:2px 14px 10px;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex:none;
  background:linear-gradient(135deg,#0a84ff33,#5e5ce633);box-shadow:inset 0 0 0 1px #0a84ff55}
.act.off{background:#ffffff0d;box-shadow:inset 0 0 0 1px var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:#30d158;flex:none;animation:pl 1.6s infinite}
.act.off .dot{background:#636366;animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 #30d15899}100%{box-shadow:0 0 0 10px #30d15800}}
.act .t{flex:1;min-width:0}
.act .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .t span{font-size:12px;color:#c7d6ff}.act.off .t span{color:var(--dim)}
.off-btn{padding:7px 12px;border-radius:10px;background:#ff453a;color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;flex:none;transition:filter .15s}
.off-btn:hover{filter:brightness(1.12)}.off-btn:active{filter:brightness(.85)}

/* cari + tab */
.srch{margin:0 14px 10px;display:flex;align-items:center;gap:8px;background:#ffffff12;border-radius:12px;padding:9px 12px;flex:none;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .15s}
.srch:focus-within{box-shadow:inset 0 0 0 1.5px #0a84ff}
.srch svg{stroke:var(--dim);flex:none}
.srch input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:inherit;color:#fff}
.srch input::placeholder{color:#7d7d88}
.srch kbd{font:11px monospace;color:var(--dim);border:1px solid #ffffff2a;border-radius:5px;padding:1px 6px}
.tabs{display:flex;gap:6px;padding:0 14px 10px;flex:none;overflow:hidden}
.tab{padding:6px 13px;border-radius:16px;background:#ffffff10;color:#c7c7d1;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s}
.tab:hover{background:#ffffff1d}
.tab.a{background:#fff;color:#000}

/* daftar */
.list{flex:1;overflow:auto;padding:0 8px 8px;min-height:0}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:#ffffff26;border-radius:3px}
.sec{padding:12px 10px 5px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;cursor:pointer;transition:background .12s}
.row:hover,.row.sel{background:#ffffff14}
.row.sel{box-shadow:inset 0 0 0 1px #ffffff22}
.row:active{background:#ffffff22}
.row.dis{opacity:.42;cursor:default}.row.dis:hover{background:transparent}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{stroke:#fff}
.c-me{background:linear-gradient(#4aa8ff,#0a6fe0)}.c-job{background:linear-gradient(#ffb340,#ec7c00)}
.c-city{background:linear-gradient(#cf7bff,#9a3fd0)}.c-near{background:linear-gradient(#4fe07a,#1fa84a)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d{flex:none;text-align:right}.d b{display:block;font-size:13px;font-weight:600}.d span{font-size:11px;color:var(--dim)}
.go{flex:none;width:28px;height:28px;border-radius:50%;background:#ffffff14;display:grid;place-items:center}
.go svg{stroke:#fff}
.row.on .go{background:#30d158}
.empty{text-align:center;color:var(--dim);padding:48px 30px;font-size:13.5px}

.ft{display:flex;justify-content:space-between;padding:9px 16px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);flex:none}
.ft kbd{font:10.5px monospace;border:1px solid #ffffff2a;border-radius:4px;padding:0 5px;margin:0 2px;color:#c7c7d1}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 16px;border-radius:16px;font-size:12.5px;z-index:9;white-space:nowrap;animation:in2 .25s}
@keyframes in2{from{opacity:0;transform:translate(-50%,8px)}}
</style></head><body>
<div id="wrap">
 <div id="app">
  <div class="hd">
   <div class="logo" id="logo"></div>
   <h1>GPS<small id="sub">Pilih tujuan, ikuti checkpoint di radar</small></h1>
   <div class="x" id="x"></div>
  </div>
  <div class="act off" id="act"></div>
  <div class="srch"><span id="si"></span><input id="q" placeholder="Cari tujuan…" maxlength="30" autocomplete="off"><kbd>/</kbd></div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <div class="ft"><span><kbd>↑</kbd><kbd>↓</kbd> pilih &nbsp;<kbd>Enter</kbd> mulai</span><span><kbd>Esc</kbd> tutup</span></div>
 </div>
</div>
<script>
(function(){'use strict';
/* ===== KONTRAK DENGAN PAWN (cef_emit_event -> halaman / cef.emit -> Pawn; isi = JSON string) =====
 Pawn -> halaman:
  gps:open   {active:{name,dist}|null, list:[{k,cat,name,sub,dist,ok}]}
             k    = kunci tujuan (unik, dikirim balik di gps:go)
             cat  = "me" | "job" | "city" | "near"
             sub  = keterangan kecil (mis. nama jalan / "Belum punya rumah")
             dist = jarak dari pemain (meter), dihitung server; -1 kalau tidak diketahui
             ok   = 1 bisa dipilih, 0 abu-abu (mis. belum punya rumah / tidak ada ATM terdaftar)
  gps:close
 Halaman -> Pawn:
  gps:ready ""  |  gps:go "k"  |  gps:off ""  |  gps:close ""
  CATATAN: setelah gps:go server yang menutup browser (pakai timer, jangan destroy dari dalam callback-nya sendiri). */
var $=function(i){return document.getElementById(i)};
function E(e,a){if(window.cef)window.cef.emit(e,a==null?'':(typeof a=='string'?a:JSON.stringify(a)))}
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pr(s){try{return JSON.parse(s)}catch(e){return null}}

/* ikon garis (24x24) */
var P={
 home:"M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z",
 shop:"M3 9l1.5-5h15L21 9M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0M5 12v8h14v-8",
 car:"M5 16l1.6-6h10.8L19 16M3 16h18v3H3zM7 19v1.5M17 19v1.5",
 box:"M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10",
 truck:"M2 6h12v10H2zM14 9h4l3 3v4h-7M7 19a1.6 1.6 0 100-.01M17 19a1.6 1.6 0 100-.01",
 work:"M3 8h18v12H3zM9 8V5h6v3M3 13h18",
 building:"M5 21V4h9v17M14 9h5v12M8 8h3M8 12h3M8 16h3M3 21h18",
 bank:"M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18",
 shield:"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",
 cross:"M9 3h6v6h6v6h-6v6H9v-6H3V9h6z",
 news:"M4 5h13v14H5a1 1 0 01-1-1zM17 9h3v9a1 1 0 01-1 1M7 9h7M7 12h7M7 15h4",
 atm:"M3 6h18v12H3zM3 10h18M7 15h3",
 tool:"M4 20l8-8M12 12a4 4 0 105-5l-3 3-2-2 3-3a4 4 0 00-3 7z",
 food:"M6 3v8a2 2 0 004 0V3M8 11v10M17 3c-2 2-3 5-3 8h3v10",
 pin:"M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11zM12 12a2.5 2.5 0 100-5 2.5 2.5 0 000 5z",
 nav:"M12 3L5 20l7-4 7 4z",
 x:"M6 6l12 12M18 6L6 18",
 srch:"M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4",
 go:"M9 6l6 6-6 6",
 ok:"M5 12l5 5 9-10"
};
function ic(n,s){var e=h('span');e.style.display='inline-flex';e.innerHTML='<svg viewBox="0 0 24 24" width="'+(s||20)+'" height="'+(s||20)+'" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="'+P[n]+'"/></svg>';return e}

var CATS=[['all','Semua'],['me','Saya'],['job','Kerja'],['city','Kota'],['near','Terdekat']];
var SEC={me:'Lokasi saya',job:'Pekerjaan',city:'Kota',near:'Terdekat'};
/* ikon per kunci tujuan (kalau server tidak mengirim, dipakai ikon default kategori) */
var KI={house:'home',bisnis:'shop',vehicle:'car',mission:'box',hauling:'truck',
 job_taxi:'car',job_mech:'tool',job_lumber:'work',job_trucker:'truck',job_miner:'work',job_prod:'box',job_farmer:'work',job_sweeper:'work',job_bus:'car',
 cityhall:'building',bank:'bank',dealer:'car',sapd:'shield',sags:'building',samd:'cross',sana:'news',
 atm:'atm',market:'shop',equip:'tool',food:'food'};
var KD={me:'pin',job:'work',city:'building',near:'pin'};

var S={items:[],active:null,cat:'all',q:'',sel:-1,vis:[]};

function fd(m){m=Number(m);if(!(m>=0))return '';return m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km'}
function eta(m){m=Number(m);if(!(m>=0))return '';var s=m/14;   /* ~50 km/jam */
 if(s<60)return '< 1 mnt';return '≈ '+Math.round(s/60)+' mnt'}

/* ---------- render ---------- */
function drawAct(){var a=$('act');a.innerHTML='';
 if(S.active){a.className='act';a.appendChild(h('div','dot'));var t=h('div','t');t.appendChild(h('b',null,S.active.name));
  t.appendChild(h('span',null,'Rute aktif'+(S.active.dist>=0?' · '+fd(S.active.dist)+' · '+eta(S.active.dist):'')));a.appendChild(t);
  var b=h('div','off-btn','Matikan');b.onclick=function(){E('gps:off');S.active=null;drawAct();drawList();toast('GPS dimatikan')};a.appendChild(b)}
 else{a.className='act off';a.appendChild(h('div','dot'));var t2=h('div','t');t2.appendChild(h('b',null,'Tidak ada rute aktif'));t2.appendChild(h('span',null,'Pilih tujuan di bawah untuk memasang checkpoint'));a.appendChild(t2)}}

function drawTabs(){var t=$('tabs');t.innerHTML='';CATS.forEach(function(c){var d=h('div','tab'+(S.cat==c[0]?' a':''),c[1]);d.onclick=function(){S.cat=c[0];S.sel=-1;drawTabs();drawList()};t.appendChild(d)})}

function drawList(keepScroll){var box=$('list'),st=box.scrollTop;box.innerHTML='';S.vis=[];
 var q=S.q.trim().toLowerCase(),last='';
 S.items.forEach(function(it){
  if(S.cat!='all'&&it.cat!=S.cat)return;
  if(q&&(it.name+' '+(it.sub||'')).toLowerCase().indexOf(q)<0)return;
  if(S.cat=='all'&&it.cat!=last){box.appendChild(h('div','sec',SEC[it.cat]||it.cat));last=it.cat}
  var idx=S.vis.length;S.vis.push(it);
  var r=h('div','row'+(it.ok?'':' dis')+(S.sel==idx?' sel':'')+(S.active&&S.active.k==it.k?' on':'')),i=h('div','ico c-'+it.cat),t=h('div','t'),d=h('div','d');
  i.appendChild(ic(KI[it.k]||KD[it.cat]||'pin',20));r.appendChild(i);
  t.appendChild(h('b',null,it.name));t.appendChild(h('span',null,it.sub||''));r.appendChild(t);
  if(it.ok&&it.dist>=0){d.appendChild(h('b',null,fd(it.dist)));d.appendChild(h('span',null,eta(it.dist)));r.appendChild(d)}
  var g=h('div','go');g.appendChild(ic(S.active&&S.active.k==it.k?'ok':'go',15));r.appendChild(g);
  r.onclick=function(){S.sel=idx;pick(it)};r.onmouseenter=function(){};
  box.appendChild(r)});
 if(!S.vis.length)box.appendChild(h('div','empty',q?'Tidak ada tujuan yang cocok.':'Belum ada tujuan.'));
 box.scrollTop=keepScroll?st:0}

function pick(it){if(!it.ok){toast(it.sub||'Tujuan tidak tersedia');return}
 S.active={k:it.k,name:it.name,dist:it.dist};E('gps:go',it.k);
 if(window.cef){hide()}   /* server menutup browser lewat timer */
 else{drawAct();drawList(true);toast('GPS aktif → '+it.name)}}

/* ---------- tampil / sembunyi ---------- */
function show(){$('wrap').classList.add('on');setTimeout(function(){$('q').focus()},120)}
function hide(){$('wrap').classList.remove('on')}
function toast(t){var e=h('div','toast',t);$('app').appendChild(e);setTimeout(function(){e.remove()},1800)}
function fit(){var k=Math.min(innerWidth/460,innerHeight/700,1);$('app').style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();

/* ---------- input ---------- */
function move(d){var n=S.vis.length,i=S.sel,k;if(!n)return;for(k=0;k<n;k++){i=(i+d+n)%n;if(S.vis[i].ok)break}   /* lewati tujuan abu-abu */
 S.sel=S.vis[i].ok?i:-1;drawList(true);
 var e=document.querySelector('.row.sel');if(e)e.scrollIntoView({block:'nearest'})}
$('q').oninput=function(){S.q=this.value;S.sel=-1;drawList()};
document.addEventListener('keydown',function(e){
 if(e.key=='Escape'){hide();E('gps:close');return}
 if(e.key=='ArrowDown'){e.preventDefault();move(1)}
 else if(e.key=='ArrowUp'){e.preventDefault();move(-1)}
 else if(e.key=='Enter'){var it=S.vis[S.sel]||S.vis.filter(function(v){return v.ok})[0];if(it)pick(it)}
 else if(e.key=='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}});
$('x').onclick=function(){hide();E('gps:close')};
$('x').appendChild(ic('x',16));$('logo').appendChild(ic('nav',19));$('si').appendChild(ic('srch',16));

function load(d){if(!d)return;S.items=d.list||[];S.active=d.active||null;
 if(S.active){var f=S.items.filter(function(i){return i.k==S.active.k})[0];if(f&&S.active.k==null)S.active.k=f.k}
 drawAct();drawTabs();drawList()}

/* ---------- Pawn / pratinjau ---------- */
if(window.cef){
 cef.on('gps:open',function(s){load(pr(s));S.q='';$('q').value='';S.sel=-1;show()});
 cef.on('gps:close',function(){hide()});
 E('gps:ready');
}else{
 /* pratinjau di browser biasa: data contoh */
 load({active:null,list:[
  {k:'house',cat:'me',name:'Rumah Saya',sub:'Idlewood, Los Santos',dist:1240,ok:1},
  {k:'bisnis',cat:'me',name:'Bisnis Saya',sub:'Belum punya bisnis',dist:-1,ok:0},
  {k:'vehicle',cat:'me',name:'Kendaraan Saya',sub:'Infernus · B 1234 OT',dist:320,ok:1},
  {k:'mission',cat:'job',name:'Misi Trucker',sub:'Belum mengambil misi',dist:-1,ok:0},
  {k:'hauling',cat:'job',name:'Hauling Trucker',sub:'Gas station Ocean Docks',dist:4210,ok:1},
  {k:'job_taxi',cat:'job',name:'Taxi',sub:'Lowongan pekerjaan',dist:1850,ok:1},
  {k:'job_mech',cat:'job',name:'Mechanic',sub:'Lowongan pekerjaan',dist:620,ok:1},
  {k:'job_lumber',cat:'job',name:'Lumber Jack',sub:'Lowongan pekerjaan',dist:7900,ok:1},
  {k:'job_trucker',cat:'job',name:'Trucker',sub:'Lowongan pekerjaan',dist:3100,ok:1},
  {k:'job_miner',cat:'job',name:'Miner',sub:'Lowongan pekerjaan',dist:11800,ok:1},
  {k:'job_bus',cat:'job',name:'Bus (Side Job)',sub:'Lowongan pekerjaan',dist:980,ok:1},
  {k:'cityhall',cat:'city',name:'Los Santos City Hall',sub:'Pemerintahan',dist:2300,ok:1},
  {k:'bank',cat:'city',name:'Bank Los Santos',sub:'Bank',dist:3400,ok:1},
  {k:'dealer',cat:'city',name:'Showroom / Dealer',sub:'Beli kendaraan',dist:540,ok:1},
  {k:'sapd',cat:'city',name:'Pintu SAPD',sub:'Kepolisian',dist:2750,ok:1},
  {k:'samd',cat:'city',name:'Pintu SAMD',sub:'Medis',dist:1900,ok:1},
  {k:'sana',cat:'city',name:'Pintu SANA',sub:'Belum terdaftar di map',dist:-1,ok:0},
  {k:'atm',cat:'near',name:'ATM Terdekat',sub:'Jalan terdekat',dist:180,ok:1},
  {k:'market',cat:'near',name:'24/7 Market Terdekat',sub:'Toko',dist:410,ok:1},
  {k:'equip',cat:'near',name:'Equipment Store Terdekat',sub:'Toko',dist:1500,ok:1},
  {k:'food',cat:'near',name:'Fast Food Terdekat',sub:'Makanan',dist:260,ok:1}]});
 show();
 window.__gps={show:show,S:S,active:function(){S.active={k:'house',name:'Rumah Saya',dist:1240};drawAct();drawList(true)}};
}
})();
</script></body></html>
